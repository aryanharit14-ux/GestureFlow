[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gestureflow"
version = "0.1.0"
description = "Local gesture and voice desktop controller for macOS and Windows"
readme = "README.md"
# Verify the Python versions your pinned MediaPipe release supports
requires-python = ">=3.10,<3.13"
dependencies = [
  "mediapipe>=0.10.9",
  "numpy>=1.24",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
ui = ["PySide6>=6.6"]
voice = ["faster-whisper>=1.0", "sounddevice>=0.4"]
train = ["torch>=2.0", "torchvision>=0.15", "scikit-learn>=1.3", "matplotlib>=3.7", "ultralytics>=8.0", "mlflow>=2.0"]
mac = ["pyobjc-framework-Quartz; sys_platform == 'darwin'"]
windows = ["pywin32; sys_platform == 'win32'"]
dev = ["pytest>=7.4", "ruff>=0.4", "mypy>=1.8", "pre-commit>=3.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
